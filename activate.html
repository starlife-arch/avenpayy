<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/brand/avenpay-icon.svg?v=3" sizes="any">
    <link rel="icon" href="/icon.png?v=3" type="image/png">
    <link rel="apple-touch-icon" href="/icon.png?v=3">
    <meta name="theme-color" content="#ffffff">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate Subscription - AvenPay</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-sm w-full bg-white p-8 rounded-3xl border border-slate-200 shadow-2xl">
        <h2 class="text-2xl font-bold mb-6 text-center">Upgrade Account</h2>
        <form id="paymentForm" class="space-y-4">
            <div>
                <label class="block text-sm text-slate-500 mb-1">M-Pesa Number (254...)</label>
                <input type="number" id="phone" placeholder="2547XXXXXXXX" class="w-full bg-slate-50 p-3 rounded-xl border border-slate-300 focus:border-teal-500 outline-none transition" required>
            </div>
            <div>
                <label class="block text-sm text-slate-500 mb-1">Select Plan</label>
                <select id="plan" class="w-full bg-slate-50 p-3 rounded-xl border border-slate-300 outline-none">
                    <option value="350">Monthly - 350 KES</option>
                    <option value="2200">Yearly - 2,200 KES</option>
                </select>
            </div>
            <button type="submit" id="payBtn" class="w-full bg-teal-600 hover:bg-teal-500 py-3 rounded-xl font-bold transition">Pay Now</button>
        </form>
        <div id="status" class="mt-6 text-center text-sm hidden"></div>
    </div>

    <script>
        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('payBtn');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            status.classList.remove('hidden');
            status.innerText = "Processing STK Push...";

            const res = await fetch('activate.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    phone: document.getElementById('phone').value, 
                    amount: document.getElementById('plan').value 
                })
            });

            const data = await res.json();
            
            if (data.checkout_id) {
                status.innerText = "Payment initiated! Checking status...";
                // Poll check_payment.php
                let check = setInterval(async () => {
                    const checkRes = await fetch(`check_payment.php?checkoutID=${data.checkout_id}`);
                    const checkData = await checkRes.json();
                    if (checkData.status === 'active') {
                        clearInterval(check);
                        status.className = "mt-6 text-center text-emerald-600 font-bold";
                        status.innerText = "Activation Successful! Redirecting...";
                        setTimeout(() => window.location.href = '../dashboard.php', 2000);
                    }
                }, 3000);
            } else {
                status.innerText = "Error: " + (data.message || "Request failed");
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
